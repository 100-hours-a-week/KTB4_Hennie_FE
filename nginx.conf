# 기본 설정
server {
    listen 80;
    server_name devbadak.com;

    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS를 통해 재생성된 backend 컨테이너의 주소를 주기적으로 갱신한다.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8080;

    # Spring의 10MB 이미지 업로드를 프록시할 수 있도록 여유 있게 설정
    client_max_body_size 12m;

    # SPA 라우팅 대응
    # index.html은 매번 재검증해야 배포 직후 예전 번들을 가리키는 일이 없다.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # 해시 붙은 JS/CSS 캐시 적용
    location ~* "^/assets/.*-[A-Za-z0-9_-]{8,}\.(js|css)$" {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 이름 고정된 자산 캐시 적용
    location /assets/ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public";
    }

    # 리버스 프록시
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Spring이 제공하는 업로드 파일 경로를 유지한 채 프록시
    location /uploads/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
